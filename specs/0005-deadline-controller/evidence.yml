    observations:
      - case: CASE-CONTROLLER-CAPABILITIES
        tests:
          - is a native cancellation controller with a stable signal
          - deadline controllers preserve native authority and typed monitoring
      - case: CASE-CONTROLLER-FANOUT
        tests:
          - 'CASE-CONTROLLER-FANOUT: shared negotiation budget permits loser cancellation and explicit winner handoff'
      - case: CASE-CONTROLLER-BOUNDS
        tests:
          - validates constraints and clock identity before linking
      - case: CASE-CONTROLLER-EXPIRY
        tests:
          - captures one shared fixed budget and requests rather than completing work
          - rechecks early wakeups without restarting the bound
          - synthetic abort events do not stop deadline monitoring
      - case: CASE-CONTROLLER-LINKS
        tests:
          - pre-aborted upstream wins over an expired deadline
          - dynamic links are directional, independently detachable and retain exact reasons
      - case: CASE-CONTROLLER-RELEASE
        tests:
          - close stops enforcement without aborting, permits local abort and rejects links
          - failed scheduler removal is logically invalidated and retryable
          - failed unlink is retryable and upstream cannot forward after close begins
      - case: CASE-CONTROLLER-MONITOR
        tests:
          - monitor failures retain identity and request cancellation
          - scheduler replacement failures request cancellation and remain observable
          - reentrant close retains a later monitor failure and invalidates scheduling
          - abort cleanup failure is observed separately and remains retryable
    limits:
      - These are bounded observations, not complete requirement-level conformance assessments.
      - Fan-out models negotiation but does not exercise real ICE or a downstream lifecycle consumer.
      - Controller reuse by scopes or facades is not claimed; their separate owners remain.
      - Publication and compatibility review remain separate.
